name: Deploy to GitHub Pages

# main の中身を、そのままいちばん上（https://log.699.jp/）に出す。
# テスト版（v2 ブランチ）は v2/ フォルダ（https://log.699.jp/v2/）に入れて、いっしょに出す。
# v2 ブランチに push したときは、v2 ブランチの .github/workflows/v2-deploy.yml が、このワークフローを main で動かす
# （github-pages の環境は main からしかデプロイできないので、v2 から直接は出さない）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # テスト版。取れなくても（v2 ブランチを消したあとなど）、本番の配信は止めない
      - name: Add the test version (v2 branch) under v2/
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: v2
          path: v2
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # アップロードした直後の成果物は、GitHub 側で一覧に出るまで数秒〜数十秒おくれることがある。
      # すぐ deploy-pages を動かすと「No artifacts named "github-pages" were found」で失敗する
      # （actions/deploy-pages#451）ので、一覧に出るまで待つ
      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' || echo 0)
            if [ "$count" -ge 1 ]; then sleep 3; exit 0; fi
            sleep 3
          done
          echo "github-pages の成果物が一覧に出ませんでした"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
